[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ragtime-llm"
version = "11.11.11"
description = "A powerful RAG system for processing and querying YouTube videos using distributed computing"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
dependencies = [
    "numpy>=1.24.0",
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "sentence-transformers>=2.2.0",
    "faiss-cpu>=1.7.0",
    "pytube>=12.0.0",
    "youtube-transcript-api>=0.6.0",
    "whisper>=1.0.0",
    "moviepy>=1.0.3",
    "gradio>=3.50.0",
    "openai>=1.0.0",
    "requests>=2.31.0",
    "pillow>=10.0.0",
    "tiktoken>=0.5.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.65.0",
    "ray>=2.9.0",
    "ray[default]>=2.9.0",
    "ray[tune]>=2.9.0",
    "ray[rllib]>=2.9.0",
    "ray[serve]>=2.9.0",
    "pandas>=2.2.3",
    "pluggy>=1.5.0",
    "pytest>=8.3.5",
    "psutil>=7.0.0",
    "gitpython>=3.1.44",
    "opencv-python>=4.11.0.86",
    "librosa>=0.11.0",
    "llama-stack>=0.2.4",
    "rich>=14.0.0",
]
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0"
]

[project.scripts]
ragtime = "ragtime_llm.cli:main"

[tool.setuptools]
packages = ["ragtime_llm"]

[tool.black]
line-length = 88
target-version = ["py38"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"

[tool.coverage.run]
source = ["ragtime_llm"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "raise ImportError",
]
ignore_errors = true
omit = ["tests/*", "setup.py"]
