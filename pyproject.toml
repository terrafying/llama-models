[project]
name = "ragtime-llm"
version = "0.1.0"
description = "A Joplin-inspired RAG system for YouTube videos with GPU acceleration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gradio>=5.27.1",
    "librosa>=0.11.0",
    "llama-cpp-python>=0.3.8",
    "matplotlib>=3.10.1",
    "moviepy>=2.1.2",
    "numpy>=2.2.5",
    "openai>=1.76.0",
    "openai-whisper>=20240930",
    "opencv-python>=4.11.0.86",
    "pillow>=10.4.0",
    "pydub>=0.25.1",
    "python-speech-features>=0.6",
    "pytube>=15.0.0",
    "requests>=2.32.3",
    "sentence-transformers>=4.1.0",
    "tiktoken>=0.9.0",
    "torch>=2.7.0",
    "torchaudio>=2.7.0",
    "whisper>=1.1.10",
    "youtube-transcript-api>=1.0.3",
]

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=ragtime_llm"
asyncio_mode = "strict"

[tool.coverage.run]
source = ["ragtime_llm"]
omit = ["tests/*", "setup.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "raise ImportError",
]
