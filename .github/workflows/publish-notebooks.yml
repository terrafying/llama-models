name: Publish Notebooks

on:
  push:
    branches: [ main ]
    paths:
      - 'notebooks/**'
      - '.github/workflows/publish-notebooks.yml'
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jupyter nbconvert jupyterlab
          
      - name: Convert notebooks to HTML
        run: |
          jupyter nbconvert --to html notebooks/*.ipynb --output-dir docs/notebooks
          
      - name: Create index
        run: |
          echo "# RAG-LLM Notebooks" > docs/notebooks/index.md
          echo "\n## Available Notebooks\n" >> docs/notebooks/index.md
          for f in docs/notebooks/*.html; do
            name=$(basename "$f" .html)
            echo "- [$name]($name.html)" >> docs/notebooks/index.md
          done
          
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages 