name: Model Testing and Validation

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'ragtime_llm/core/**'
      - 'tests/test_models.py'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'ragtime_llm/core/**'
      - 'tests/test_models.py'
  schedule:
    - cron: '0 0 * * 0'  # Run weekly on Sunday

jobs:
  test-models:
    name: Test Models
    runs-on: ubuntu-latest
    strategy:
      matrix:
        model_type: [llm, embedding, audio, video]
        
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg
        
    - name: Cache models
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/huggingface
          .cache/models
        key: ${{ runner.os }}-models-${{ matrix.model_type }}-${{ hashFiles('config/base.yaml') }}
        restore-keys: |
          ${{ runner.os }}-models-${{ matrix.model_type }}-
          
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run model tests
      env:
        HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
      run: |
        python -m pytest tests/test_models.py -k "${{ matrix.model_type }}" -v
        
    - name: Run model validation
      env:
        HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
      run: |
        python -m pytest tests/test_models.py -k "validate_${{ matrix.model_type }}" -v
        
    - name: Run performance benchmarks
      env:
        HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
      run: |
        python -m pytest tests/test_models.py -k "benchmark_${{ matrix.model_type }}" -v
        
    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: model-test-results-${{ matrix.model_type }}
        path: |
          test-results/
          .pytest_cache/
          
  validate-configs:
    name: Validate Model Configurations
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Validate configurations
      run: |
        python -c "from ragtime_llm.utils.config_manager import ConfigManager; ConfigManager().validate_config()"
        
    - name: Check model availability
      env:
        HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
      run: |
        python -c "from ragtime_llm.utils.discovery import ResourceDiscovery; ResourceDiscovery().discover_models()" 